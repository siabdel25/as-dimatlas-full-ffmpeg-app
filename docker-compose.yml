services:
  videocoder:
    build: .
    container_name: videocoder
    ports:
      - "5000:5000"
    volumes:
      # Les fichiers produits restent sur la machine hôte. Chemins
      # surchargeables via un fichier .env (voir .env.example) — défauts
      # relatifs au dossier du projet si .env absent, rétrocompatible.
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - ${AUDIO_DIR:-./audio}:/app/audio
      # Paramètres (dashboard Paramètres) : hors volume, config.json serait
      # effacé à chaque `docker compose up -d --build`.
      - ${CONFIG_DIR:-./config}:/app/config
    restart: unless-stopped
