services:
  videocoder:
    build: .
    container_name: videocoder
    ports:
      - "5000:5000"
    volumes:
      # Les fichiers produits restent sur la machine hôte. Chemins
      # surchargeables via un fichier .env (voir .env.example) — défauts
      # relatifs au dossier du projet si .env absent, rétrocompatible.
      - ${DOWNLOADS_DIR:-./downloads}:/app/downloads
      - ${AUDIO_DIR:-./audio}:/app/audio
      # Paramètres (dashboard Paramètres) : hors volume, config.json serait
      # effacé à chaque `docker compose up -d --build`.
      - ${CONFIG_DIR:-./config}:/app/config
      # Cookies YouTube (optionnel) : déposer cookies.txt dans ce dossier si
      # YouTube répond « Sign in to confirm you're not a bot ».
      - ${COOKIES_DIR:-./cookies}:/app/cookies:ro
    restart: unless-stopped

  # https pour la PWA (optionnel) : docker compose --profile https up -d
  # Nécessite DOMAIN dans .env et les ports 80/443 ouverts vers cette machine.
  caddy:
    image: caddy:2
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - videocoder
    restart: unless-stopped

volumes:
  caddy_data:
