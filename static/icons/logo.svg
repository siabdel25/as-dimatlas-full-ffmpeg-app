    <ellipse cx="160" cy="238" rx="15" ry="28" fill="#4a63e0"/><ellipse cx="352" cy="238" rx="15" ry="28" fill="#4a63e0"/>
    <!-- visage -->
    <path d="M160 222 C160 142 206 104 256 104 C306 104 352 142 352 222 C352 292 314 352 256 358 C198 352 160 292 160 222 Z" fill="url(#skin)"/>
    <path d="M176 200 C180 150 214 122 256 122" fill="none" stroke="#b9c8ff" stroke-opacity=".35" stroke-width="8" stroke-linecap="round"/>
    <!-- casque -->
    <path d="M148 222 C146 122 198 72 256 72 C314 72 366 122 364 222" fill="none" stroke="#1c1e23" stroke-width="16" stroke-linecap="round"/>
    <path d="M148 222 C146 122 198 72 256 72 C314 72 366 122 364 222" fill="none" stroke="#e8a33d" stroke-width="3" stroke-linecap="round" opacity=".85"/>
    <rect x="132" y="206" width="30" height="70" rx="15" fill="#1c1e23"/><rect x="350" y="206" width="30" height="70" rx="15" fill="#1c1e23"/>
    <rect x="139" y="226" width="16" height="30" rx="8" fill="#e8a33d" filter="url(#glow)"/><rect x="357" y="226" width="16" height="30" rx="8" fill="#e8a33d" filter="url(#glow)"/>
    <path d="M142 272 C150 316 186 336 224 338" fill="none" stroke="#1c1e23" stroke-width="6" stroke-linecap="round"/>
    <circle cx="228" cy="338" r="9" fill="#1c1e23"/><circle cx="228" cy="338" r="4" fill="#e8a33d" filter="url(#glow)"/>
    <!-- sourcils / yeux -->
    <path d="M196 214 Q222 200 246 212" fill="none" stroke="#25328f" stroke-width="5" stroke-linecap="round"/>
    <path d="M266 212 Q290 200 316 214" fill="none" stroke="#25328f" stroke-width="5" stroke-linecap="round"/>
    <g filter="url(#glow)">
      <path d="M200 238 Q222 220 246 238 Q222 252 200 238 Z" fill="#e8a33d"/>
      <path d="M266 238 Q290 220 312 238 Q290 252 266 238 Z" fill="#e8a33d"/>
    </g>
    <circle cx="223" cy="237" r="7" fill="#16130c"/><circle cx="289" cy="237" r="7" fill="#16130c"/>
    <circle cx="226" cy="234" r="2.2" fill="#fff"/><circle cx="292" cy="234" r="2.2" fill="#fff"/>
    <!-- nez, bouche -->
    <path d="M256 250 L249 288 Q256 295 263 288" fill="none" stroke="#2b3fae" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M234 318 Q256 332 278 318" fill="none" stroke="#1d2766" stroke-width="5" stroke-linecap="round"/>
    <!-- marque frontale : ‹ · › -->
    <g fill="none" stroke="#e8a33d" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <path d="M241 128 L226 146 L241 164"/><path d="M271 128 L286 146 L271 164"/>
    </g>
    <circle cx="256" cy="146" r="4.5" fill="#e8a33d" filter="url(#glow)"/>
    <!-- points bioluminescents -->
    <g fill="#8fe9ff" filter="url(#glow)">
      <circle cx="190" cy="270" r="3.4"/><circle cx="204" cy="282" r="2.6"/><circle cx="184" cy="288" r="2.4"/><circle cx="214" cy="296" r="2.2"/><circle cx="196" cy="304" r="2"/>
      <circle cx="322" cy="270" r="3.4"/><circle cx="308" cy="282" r="2.6"/><circle cx="328" cy="288" r="2.4"/><circle cx="298" cy="296" r="2.2"/><circle cx="316" cy="304" r="2"/>
      <circle cx="214" cy="178" r="2.4"/><circle cx="298" cy="178" r="2.4"/><circle cx="196" cy="196" r="2"/><circle cx="316" cy="196" r="2"/>
    </g>
