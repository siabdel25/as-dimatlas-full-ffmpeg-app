<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 580" width="512" height="580" role="img" aria-label="SDK WI — Siabdel — Entreprise Dimatlas.com">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6c15a"/><stop offset="1" stop-color="#d98f22"/></linearGradient>
  </defs>
  <!-- médaillon -->
  <g transform="translate(26 92) scale(.9)">
  <defs>
    <clipPath id="c"><circle cx="256" cy="256" r="248"/></clipPath>
    <radialGradient id="bg" cx="50%" cy="42%" r="62%"><stop offset="0" stop-color="#3a2a12"/><stop offset=".55" stop-color="#1b1a1e"/><stop offset="1" stop-color="#131417"/></radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d97ff"/><stop offset=".6" stop-color="#4a63e0"/><stop offset="1" stop-color="#3347b8"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3794"/><stop offset="1" stop-color="#171d52"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- halo -->
    <circle cx="256" cy="236" r="190" fill="none" stroke="#e8a33d" stroke-opacity=".16" stroke-width="2"/>
    <circle cx="256" cy="236" r="225" fill="none" stroke="#e8a33d" stroke-opacity=".08" stroke-width="2"/>
    <!-- épaules -->
    <path d="M60 520 C70 420 160 388 256 388 C352 388 442 420 452 520 Z" fill="url(#body)"/>
