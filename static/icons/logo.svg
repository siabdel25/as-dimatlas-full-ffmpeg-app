      <circle cx="362" cy="450" r="3.2"/><circle cx="336" cy="432" r="2.6"/><circle cx="312" cy="448" r="3"/><circle cx="288" cy="430" r="2.4"/>
    </g>
    <!-- cou -->
    <path d="M220 330 L220 396 Q256 418 292 396 L292 330 Z" fill="#3a50c9"/>
    <path d="M220 372 Q256 392 292 372 L292 396 Q256 418 220 396 Z" fill="#2b3da6"/>
