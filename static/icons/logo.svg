  <circle cx="256" cy="256" r="244" fill="none" stroke="#c1272d" stroke-width="16"/>
  <circle cx="256" cy="256" r="233" fill="none" stroke="#006233" stroke-width="4"/>
</g>
  <!-- couronne -->
  <g stroke="#16130c" stroke-width="5" stroke-linejoin="round">
    <path d="M190 104 L176 46 L220 76 L256 30 L292 76 L336 46 L322 104 Z" fill="url(#gold)"/>
    <rect x="186" y="96" width="140" height="26" rx="8" fill="#c1272d"/>
  </g>
  <g stroke="#16130c" stroke-width="3">
    <circle cx="176" cy="44" r="9" fill="#006233"/><circle cx="256" cy="28" r="10" fill="#c1272d"/><circle cx="336" cy="44" r="9" fill="#006233"/>
  </g>
  <g fill="#f6c15a"><circle cx="214" cy="109" r="5"/><circle cx="256" cy="109" r="5"/><circle cx="298" cy="109" r="5"/></g>
  <!-- étoile : pastille rouge + pentagramme vert -->
  <g transform="translate(420 478)">
    <circle r="62" fill="#131417"/>
    <circle r="54" fill="#c1272d"/>
    <path d="M0.0 -34.0 L21.2 31.1 L-34.2 -9.1 L34.2 -9.1 L-21.2 31.1 Z" fill="none" stroke="#006233" stroke-width="6.5" stroke-linejoin="miter"/>
  </g>
</svg>
