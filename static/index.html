<!DOCTYPE html>
<html lang="fr" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VideoCoder Studio</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link href="app.css" rel="stylesheet">
</head>
<body>
  <div id="app">
    <div class="vc-shell">
      <nav class="vc-sidebar" aria-label="Navigation principale">
        <div class="vc-logo">
          <i class="fa-solid fa-clapperboard dot"></i>
          VideoCoder<span class="dot">.</span>
        </div>
        <router-link class="vc-nav-link" to="/youtube">
          <i class="fa-brands fa-youtube"></i><span>YouTube</span>
        </router-link>
        <router-link class="vc-nav-link" to="/convert">
          <i class="fa-brands fa-whatsapp"></i><span>Réseaux sociaux</span>
        </router-link>
        <router-link class="vc-nav-link" to="/audio">
          <i class="fa-solid fa-music"></i><span>Extraction audio</span>
        </router-link>
        <router-link class="vc-nav-link" to="/cut">
          <i class="fa-solid fa-scissors"></i><span>Découpage</span>
        </router-link>
        <router-link class="vc-nav-link" to="/medley">
          <i class="fa-solid fa-clapperboard"></i><span>Medley</span>
        </router-link>
        <router-link class="vc-nav-link" to="/radio">
          <i class="fa-solid fa-tower-broadcast"></i><span>Radio</span>
        </router-link>
        <router-link class="vc-nav-link" to="/frames">
          <i class="fa-solid fa-images"></i><span>Images</span>
        </router-link>
        <router-link class="vc-nav-link" to="/music">
          <i class="fa-solid fa-music"></i><span>Bande musicale</span>
        </router-link>
        <router-link class="vc-nav-link" to="/text">
          <i class="fa-solid fa-heading"></i><span>Titre</span>
        </router-link>
        <router-link class="vc-nav-link" to="/effects">
          <i class="fa-solid fa-wand-magic-sparkles"></i><span>Effets</span>
        </router-link>
        <router-link class="vc-nav-link" to="/library">
          <i class="fa-solid fa-folder-open"></i><span>Bibliothèque</span>
        </router-link>
        <router-link class="vc-nav-link" to="/settings">
          <i class="fa-solid fa-gear"></i><span>Paramètres</span>
        </router-link>
        <button class="btn btn-ghost btn-sm vc-theme-toggle"
                @click="theme = theme === 'dark' ? 'light' : 'dark'"
                :title="theme === 'dark' ? 'Thème clair' : 'Thème sombre'">
          <i class="fa-solid" :class="theme === 'dark' ? 'fa-sun' : 'fa-moon'"></i>
        </button>
      </nav>
      <main class="vc-main">
        <router-view></router-view>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/vue@3.4.27/dist/vue.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-router@4.3.2/dist/vue-router.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
